name: Check jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions: {contents: write}
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .
      - run: job-watcher monitor
        env: {DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}}
      - run: |
          mkdir -p docs/data
          cp data/jobs.json data/check_status.json data/forecasts.json docs/data/
          python scripts/validate_pages_privacy.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs/data
          git diff --cached --quiet || git commit -m 'chore: update public job data'
          git push
