name: Daily Job Check & Refresh

on:
  workflow_dispatch:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC (8:00 PM EDT & 8:00 AM EDT)
    - cron: "0 0,12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Monitor jobs
        run: job-watcher monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Generate forecasts
        run: job-watcher generate-forecasts

      - name: Prepare dashboard data
        run: |
          mkdir -p docs/data
          cp data/jobs.json docs/data/jobs.json
          cp data/check_status.json docs/data/check_status.json
          cp data/forecasts.json docs/data/forecasts.json
          python scripts/validate_pages_privacy.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily job monitoring update"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

